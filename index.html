<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Randomnumber and counter</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        text-align: center;
        margin-top: 50px;
    }
    h1 {
        color: #333;
    }
    p {
        font-size: 18px;
        margin: 10px 0;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background-color: #45a049;
    }
    span {
        font-weight: bold;
        color: #2c3e50;
    }
</style>

<body>
    <h1>Randomnumbergenerator and counter</h1>
    <p>Random number: <span id="randomnumber"></span></p>
    <p>counter:<span id="counter">0</span>times</p>
    <button onclick="randomnumgenerator()">randomnumbergenerator</button>
    <script>
        let count=0;
        function randomnumgenerator(){
    const num=Math.floor(Math.random()*80)+1
        document.getElementById('randomnumber').textContent=num
        count++
        document.getElementById('counter').textContent=count
    
    }

    </script>
</body>

</html>
